name: Build winecfg.exe

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64

      - name: Build (x64 + x86)
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winecfg
          path: |
            winecfg-x64.exe
            winecfg-x86.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            winecfg-x64.exe
            winecfg-x86.exe
